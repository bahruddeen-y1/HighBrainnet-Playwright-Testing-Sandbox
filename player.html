<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>กำลังเรียน — HighBrainnet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:"#2f5f88",orange:{50:"#f0f6fb",100:"#dcebf5",200:"#bdd8ec",300:"#a7cae4",400:"#85B2D5",500:"#5b97c4",600:"#4f86b5",700:"#3f7099",800:"#335a7e",900:"#274763",950:"#1c3447"}}}}};</script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-slate-900 text-white">

  <!-- TOP BAR -->
  <header class="bg-slate-950 border-b border-slate-800">
    <div class="px-4 sm:px-6 flex items-center justify-between h-14">
      <div class="flex items-center gap-4">
        <a href="my-courses.html" class="text-slate-400 hover:text-white flex items-center gap-2 text-sm">
          <i data-lucide="chevron-left" class="w-4 h-4"></i> กลับ
        </a>
        <div class="hidden md:block">
          <div id="topCourseTitle" class="text-xs text-slate-400"></div>
          <div id="topLessonTitle" class="text-sm font-semibold"></div>
        </div>
      </div>
      <div class="flex items-center gap-4 text-xs">
        <span data-user-name class="text-slate-400"></span>
      </div>
    </div>
  </header>

  <div class="grid lg:grid-cols-[1fr_380px] min-h-[calc(100vh-56px)]">

    <!-- PLAYER COL -->
    <main class="flex flex-col">
      <!-- Video -->
      <div class="aspect-video bg-black relative">
        <video id="video" class="w-full h-full" controls playsinline controlsList="nodownload"></video>
        <div id="videoOverlay" class="absolute inset-0 grid place-items-center bg-slate-900/80 text-center p-6">
          <div>
            <i data-lucide="mouse-pointer-click" class="w-10 h-10 mx-auto text-slate-500"></i>
            <p class="mt-3 text-slate-300">เลือกบทเรียนจากรายการด้านขวาเพื่อเริ่มเรียน</p>
          </div>
        </div>
      </div>

      <!-- Info -->
      <div class="bg-white text-slate-800 flex-1 p-6">
        <h1 id="lessonTitle" class="text-2xl font-bold">เลือกบทเรียน</h1>
        <div class="flex items-center gap-3 mt-2 text-sm text-slate-500">
          <span id="lessonMeta"></span>
        </div>
        <p id="lessonDesc" class="text-slate-700 leading-relaxed mt-4"></p>

        <div id="quizSection" class="mt-6 hidden">
          <h3 class="font-bold mb-3 flex items-center gap-2">
            <i data-lucide="clipboard-check" class="w-5 h-5 text-brand"></i> แบบทดสอบ
          </h3>
          <div id="quizList" class="grid gap-2"></div>
        </div>
      </div>
    </main>

    <!-- SIDEBAR -->
    <aside class="bg-slate-950 border-l border-slate-800 overflow-y-auto max-h-[calc(100vh-56px)]">
      <div class="p-4 border-b border-slate-800">
        <div class="text-xs text-slate-400 mb-1">ความคืบหน้าทั้งคอร์ส</div>
        <div class="flex items-center gap-3">
          <div class="flex-1 progress bg-slate-800"><div id="courseProgressBar" class="progress-bar" style="width:0%"></div></div>
          <span id="courseProgressPct" class="text-sm font-bold">0%</span>
        </div>
        <div id="courseProgressText" class="text-xs text-slate-500 mt-1"></div>
      </div>

      <div class="p-4">
        <h3 class="font-bold text-sm mb-3">รายการบทเรียน</h3>
        <div id="lessonList" class="space-y-3 text-sm">
          <div class="text-slate-500 text-center py-8">กำลังโหลด...</div>
        </div>
      </div>
    </aside>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (async function () {
      if (!HBN.api.requireLogin()) return;
      const slug = new URLSearchParams(location.search).get('slug');
      if (!slug) { location.href = 'my-courses.html'; return; }

      const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const fmtDur = (sec) => {
        if (!sec) return '';
        const m = Math.floor(sec / 60), s = sec % 60;
        return `${m}:${String(s).padStart(2, '0')}`;
      };

      const video = document.getElementById('video');
      const overlay = document.getElementById('videoOverlay');
      let course = null;
      let lessons = [];          // flat list
      let current = null;        // current lesson
      let progressMap = {};      // lessonId -> {isCompleted}
      let watchTimer = null;
      let hls = null;

      // ----- load course tree -----
      try {
        course = (await HBN.api.get(`/courses/${encodeURIComponent(slug)}/tree`)).course;
      } catch (e) {
        document.getElementById('lessonList').innerHTML =
          `<div class="text-red-400 text-center py-8">${esc(e.message)}</div>`;
        return;
      }

      document.getElementById('topCourseTitle').textContent = course.title;
      document.title = `กำลังเรียน — ${course.title} — HighBrainnet`;
      lessons = course.chapters.flatMap((ch) => ch.lessons.map((l) => ({ ...l, chapterTitle: ch.title })));

      // ----- fetch progress of each lesson (parallel, tolerant) -----
      await Promise.all(lessons.map(async (l) => {
        try {
          progressMap[l.id] = await HBN.api.get(`/lessons/${l.id}/progress`);
        } catch { progressMap[l.id] = null; }
      }));

      function renderSidebar() {
        const completed = lessons.filter((l) => progressMap[l.id]?.isCompleted).length;
        const pct = lessons.length ? Math.round((completed / lessons.length) * 100) : 0;
        document.getElementById('courseProgressBar').style.width = pct + '%';
        document.getElementById('courseProgressPct').textContent = pct + '%';
        document.getElementById('courseProgressText').textContent = `เรียนไป ${completed} / ${lessons.length} บทเรียน`;

        document.getElementById('lessonList').innerHTML = course.chapters.map((ch, ci) => `
          <div>
            <div class="flex items-center justify-between text-slate-400 text-xs uppercase tracking-wide mb-2 px-2">
              <span>${ci + 1}. ${esc(ch.title)}</span><span>${ch.lessons.length} บทเรียน</span>
            </div>
            ${ch.lessons.map((l) => {
              const p = progressMap[l.id];
              const isCurrent = current?.id === l.id;
              const icon = isCurrent ? 'play-circle' : (p?.isCompleted ? 'check-circle-2' : 'circle');
              const iconColor = isCurrent ? 'text-brand' : (p?.isCompleted ? 'text-green-500' : 'text-slate-600');
              return `
                <a data-lesson="${l.id}" class="flex items-center gap-3 p-2 rounded-lg cursor-pointer ${isCurrent ? 'bg-brand/20 border-l-2 border-brand' : 'hover:bg-slate-800'}">
                  <i data-lucide="${icon}" class="w-4 h-4 ${iconColor}"></i>
                  <span class="flex-1">${esc(l.title)}</span>
                  <span class="text-xs text-slate-400">${fmtDur(l.videoDuration)}</span>
                </a>`;
            }).join('')}
          </div>`).join('');
        window.lucide?.createIcons();

        document.querySelectorAll('[data-lesson]').forEach((a) => {
          a.addEventListener('click', () => playLesson(a.dataset.lesson));
        });
      }

      async function playLesson(lessonId) {
        const lesson = lessons.find((l) => l.id === lessonId);
        if (!lesson) return;

        stopWatchTimer();

        document.getElementById('lessonTitle').textContent = lesson.title;
        document.getElementById('topLessonTitle').textContent = lesson.title;
        document.getElementById('lessonDesc').textContent = lesson.description || '';
        document.getElementById('lessonMeta').textContent = lesson.videoDuration ? `ความยาว ${fmtDur(lesson.videoDuration)}` : '';

        try {
          const play = await HBN.api.get(`/lessons/${lessonId}/play`);
          overlay.style.display = 'none';
          current = lesson;
          renderSidebar();

          // attach HLS
          if (hls) { hls.destroy(); hls = null; }
          if (window.Hls && Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(play.urls.hls);
            hls.attachMedia(video);
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = play.urls.hls;
          } else {
            video.src = play.urls.mp4_720;
          }

          // resume
          if (play.resumeAt > 0) {
            const onMeta = () => { video.currentTime = play.resumeAt; video.removeEventListener('loadedmetadata', onMeta); };
            video.addEventListener('loadedmetadata', onMeta);
            HBN.ui.toast(`เล่นต่อจากนาทีที่ ${fmtDur(play.resumeAt)}`);
          }

          video.play().catch(() => {});
          startWatchTimer(lessonId);
          loadQuizzes(lessonId);
        } catch (e) {
          overlay.style.display = '';
          overlay.querySelector('p').textContent = e.message;
          HBN.ui.toast(e.message, 'error');
        }
      }

      async function loadQuizzes(lessonId) {
        const section = document.getElementById('quizSection');
        const list = document.getElementById('quizList');
        section.classList.add('hidden');
        try {
          const { items } = await HBN.api.get(`/quizzes/lesson/${lessonId}`);
          if (!items.length) return;
          list.innerHTML = items.map((q) => `
            <a href="quiz.html?id=${q.id}&slug=${encodeURIComponent(slug)}"
               class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg hover:border-brand hover:bg-orange-50 transition">
              <i data-lucide="${q.isMockExam ? 'timer' : 'clipboard-list'}" class="w-5 h-5 text-brand"></i>
              <div class="flex-1">
                <div class="font-semibold text-sm">${esc(q.title)}</div>
                <div class="text-xs text-slate-500">
                  ${q.totalQuestions} ข้อ${q.hasTimer ? ` · จับเวลา ${q.timeLimitMinutes} นาที` : ''}${q.isPreLesson ? ' · ก่อนเรียน' : ''}
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </a>`).join('');
          section.classList.remove('hidden');
          window.lucide?.createIcons();
        } catch {}
      }

      function startWatchTimer(lessonId) {
        watchTimer = setInterval(async () => {
          if (video.paused || !video.currentTime) return;
          try {
            const r = await HBN.api.post(`/lessons/${lessonId}/watch`, {
              positionSeconds: Math.floor(video.currentTime),
            });
            if (r.progress?.isCompleted && !progressMap[lessonId]?.isCompleted) {
              progressMap[lessonId] = { ...(progressMap[lessonId] || {}), isCompleted: true };
              HBN.ui.toast('เรียนจบบทเรียนนี้แล้ว 🎉', 'success');
              renderSidebar();
            }
          } catch {}
        }, 10000);
      }
      function stopWatchTimer() {
        if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
      }

      // save position on pause/unload too
      video.addEventListener('pause', () => {
        if (current && video.currentTime) {
          HBN.api.post(`/lessons/${current.id}/watch`, { positionSeconds: Math.floor(video.currentTime) }).catch(() => {});
        }
      });
      window.addEventListener('beforeunload', () => {
        if (current && video.currentTime) {
          navigator.sendBeacon?.(
            HBN.api.BASE + `/lessons/${current.id}/watch`,
            new Blob([JSON.stringify({ positionSeconds: Math.floor(video.currentTime) })], { type: 'application/json' })
          );
        }
      });

      renderSidebar();

      // auto-play first incomplete lesson
      const next = lessons.find((l) => !progressMap[l.id]?.isCompleted) || lessons[0];
      if (next) playLesson(next.id);
    })();
  </script>
</body>
</html>
