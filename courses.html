<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>คอร์สทั้งหมด — HighBrainnet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:"#2f5f88",orange:{50:"#f0f6fb",100:"#dcebf5",200:"#bdd8ec",300:"#a7cae4",400:"#85B2D5",500:"#5b97c4",600:"#4f86b5",700:"#3f7099",800:"#335a7e",900:"#274763",950:"#1c3447"}}}}};</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-slate-50">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 glass-nav">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 grid place-items-center text-white font-extrabold">H</div>
          <div class="leading-tight"><div class="font-extrabold text-[15px]">HighBrainnet</div><div class="text-[10px] text-slate-500 -mt-0.5">เรียนรู้แบบ Concept</div></div>
        </a>
        <nav class="hidden md:flex items-center gap-7 text-sm font-medium text-slate-700">
          <a href="index.html" class="hover:text-brand">หน้าแรก</a>
          <a href="courses.html" class="text-brand">คอร์สเรียน</a>
          <a href="#" class="hover:text-brand">เกี่ยวกับเรา</a>
          <a href="#" class="hover:text-brand">ติดต่อ</a>
        </nav>
        <div class="hidden md:flex items-center gap-3">
          <a href="cart.html" class="relative w-10 h-10 grid place-items-center rounded-lg hover:bg-slate-100">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            <span data-cart-badge class="absolute top-1 right-1 w-4 h-4 text-[10px] grid place-items-center bg-brand text-white rounded-full" style="display:none">0</span>
          </a>
          <a href="my-courses.html" data-auth-only class="btn btn-ghost btn-sm" style="display:none">คอร์สของฉัน</a>
          <span data-auth-only class="text-sm font-medium" style="display:none">สวัสดี <span data-user-name></span></span>
          <a href="#" data-auth-only data-logout class="btn btn-ghost btn-sm" style="display:none">ออกจากระบบ</a>
          <a href="login.html" data-guest-only class="btn btn-ghost btn-sm">เข้าสู่ระบบ</a>
          <a href="login.html#signup" data-guest-only class="btn btn-primary btn-sm">สมัครฟรี</a>
        </div>
        <button data-menu-toggle class="md:hidden p-2"><i data-lucide="menu" class="w-6 h-6"></i></button>
      </div>
    </div>
  </header>

  <!-- BREADCRUMB & TITLE -->
  <section class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
      <nav class="text-xs text-slate-500 flex items-center gap-2 mb-3">
        <a href="index.html" class="hover:text-brand">หน้าแรก</a>
        <i data-lucide="chevron-right" class="w-3 h-3"></i>
        <span>คอร์สทั้งหมด</span>
      </nav>
      <h1 class="text-3xl font-bold">คอร์สเรียนทั้งหมด</h1>
      <p class="text-slate-500 mt-2">ค้นหาและเลือกคอร์สที่เหมาะกับเป้าหมายของคุณ</p>
    </div>
  </section>

  <!-- MAIN -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 grid lg:grid-cols-[260px_1fr] gap-8">
    <!-- SIDEBAR FILTER -->
    <aside class="card p-5 h-fit lg:sticky lg:top-20">
      <h3 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i>ตัวกรอง</h3>

      <div class="mb-5">
        <label class="text-sm font-semibold block mb-2">ค้นหา</label>
        <div class="relative">
          <input id="filterSearch" type="text" placeholder="ชื่อคอร์ส..." class="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 ring-brand" />
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        </div>
      </div>

      <div class="mb-5">
        <h4 class="text-sm font-semibold mb-2">ระดับชั้น</h4>
        <div id="levelFilters" class="space-y-2 text-sm">
          <label class="flex items-center gap-2"><input type="radio" name="levelKey" value="" class="accent-orange-500" checked> ทุกระดับ</label>
          <label class="flex items-center gap-2"><input type="radio" name="levelKey" value="PRIMARY" class="accent-orange-500"> ประถมปลาย (ป.4-6)</label>
          <label class="flex items-center gap-2"><input type="radio" name="levelKey" value="JUNIOR" class="accent-orange-500"> มัธยมต้น (ม.1-3)</label>
          <label class="flex items-center gap-2"><input type="radio" name="levelKey" value="SENIOR" class="accent-orange-500"> มัธยมปลาย (ม.4-6)</label>
        </div>
      </div>

      <button id="resetFilters" type="button" class="btn btn-outline w-full">ล้างตัวกรอง</button>
    </aside>

    <!-- COURSE GRID -->
    <div>
      <div class="flex items-center justify-between mb-5">
        <p class="text-sm text-slate-500">พบ <strong id="courseCount" class="text-slate-900">…</strong> คอร์ส</p>
      </div>

      <div id="coursesGrid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5">
        <div class="col-span-full text-center text-slate-400 py-12">กำลังโหลด...</div>
      </div>
        <!-- 9 course cards -->
        <!-- cards rendered dynamically -->

      </div>
    </div>
  </main>

  <footer class="bg-slate-900 text-slate-400 text-center text-sm py-6">© 2026 HighBrainnet</footer>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      const grid = document.getElementById('coursesGrid');
      const countEl = document.getElementById('courseCount');
      const searchEl = document.getElementById('filterSearch');
      const levelFilters = document.getElementById('levelFilters');
      const resetBtn = document.getElementById('resetFilters');

      const levelLabel = HBN.ui.levelName;
      const escapeHtml = (s = '') => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const placeholderImg = (title) =>
        `data:image/svg+xml;utf8,${encodeURIComponent(
          `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 320'><rect width='600' height='320' fill='#eff5fb'/><rect x='0' y='0' width='600' height='320' fill='url(#g)' opacity='0.4'/><defs><linearGradient id='g' x1='0' x2='1'><stop stop-color='#a7cae4'/><stop offset='1' stop-color='#5E92BC'/></linearGradient></defs><text x='50%' y='52%' fill='#3D6E96' font-family='Sarabun,sans-serif' font-size='28' font-weight='700' text-anchor='middle'>${title?.slice(0,40) || 'HighBrainnet'}</text></svg>`
        )}`;

      function renderCard(c) {
        const img = c.coverImageUrl || placeholderImg(c.title);
        return `
          <a href="course-detail.html?slug=${encodeURIComponent(c.slug)}" class="card card-hover overflow-hidden">
            <div class="relative">
              <img src="${img}" class="w-full h-40 object-cover" alt=""/>
            </div>
            <div class="p-4">
              <div class="badge badge-blue mb-2">${escapeHtml(levelLabel(c.level?.key))}</div>
              <h3 class="font-bold leading-snug">${escapeHtml(c.title)}</h3>
              <p class="text-xs text-slate-500 mt-1">${escapeHtml(c.subtitle || '')}</p>
              <div class="flex items-end justify-between mt-3">
                <div class="text-lg font-bold text-brand">${HBN.ui.bahts(c.price)}</div>
                <div class="text-xs text-slate-400">${c.currentVersion?.versionLabel || ''}</div>
              </div>
            </div>
          </a>`;
      }

      async function load() {
        grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-12">กำลังโหลด...</div>`;
        const params = new URLSearchParams();
        const lvl = levelFilters.querySelector('input[name="levelKey"]:checked')?.value;
        if (lvl) params.set('levelKey', lvl);
        const q = searchEl.value.trim();
        if (q) params.set('q', q);

        try {
          const data = await HBN.api.get('/courses?' + params.toString());
          countEl.textContent = data.total;
          if (!data.items.length) {
            grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-12">ไม่พบคอร์สที่ตรงกับการค้นหา</div>`;
            return;
          }
          grid.innerHTML = data.items.map(renderCard).join('');
          window.lucide?.createIcons();
        } catch (e) {
          grid.innerHTML = `<div class="col-span-full text-center text-red-500 py-12">โหลดไม่สำเร็จ: ${escapeHtml(e.message)}</div>`;
        }
      }

      let searchTimer;
      searchEl.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(load, 300);
      });
      levelFilters.addEventListener('change', load);
      resetBtn.addEventListener('click', () => {
        searchEl.value = '';
        levelFilters.querySelector('input[value=""]').checked = true;
        load();
      });

      load();
    })();
  </script>
</body>
</html>
