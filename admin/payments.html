<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>แอดมิน — ตรวจการชำระเงิน | HighBrainnet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="bg-slate-100">

  <div class="min-h-screen flex">
    <aside class="w-64 bg-slate-900 text-white flex-shrink-0 hidden lg:flex flex-col">
      <a href="dashboard.html" class="flex items-center gap-2 p-5 border-b border-slate-800">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 grid place-items-center text-white font-extrabold">H</div>
        <div><div class="font-bold">HighBrainnet</div><div class="text-xs text-slate-400">แอดมิน</div></div>
      </a>
      <nav class="sidenav flex-1 p-3 space-y-1 text-sm">
        <a href="dashboard.html"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> ภาพรวม</a>
        <a href="courses.html"><i data-lucide="book-open" class="w-4 h-4"></i> จัดการคอร์ส</a>
        <a href="payments.html" class="active"><i data-lucide="banknote" class="w-4 h-4"></i> ตรวจสอบการชำระเงิน</a>
        <a href="reports.html"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> รายงาน / Export</a>
      </nav>
      <a href="#" data-logout class="m-3 btn btn-ghost text-slate-300 text-sm"><i data-lucide="log-out" class="w-4 h-4"></i> ออกจากระบบ</a>
    </aside>

    <div class="flex-1 min-w-0">
      <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="px-6 flex items-center justify-between h-16">
          <h1 class="font-bold text-lg">ตรวจสอบการชำระเงิน</h1>
        </div>
      </header>

      <main class="p-6">
        <!-- tabs -->
        <div class="flex gap-1 border-b border-slate-200 mb-5">
          <button data-status="PENDING" class="statusTab tab-btn active">รอตรวจสอบ</button>
          <button data-status="AWAITING_PAYMENT" class="statusTab tab-btn">รอชำระ (QR)</button>
          <button data-status="PAID" class="statusTab tab-btn">ชำระแล้ว</button>
        </div>

        <div id="ordersList" class="grid xl:grid-cols-2 gap-5">
          <div class="col-span-full text-center text-slate-400 py-12">กำลังโหลด...</div>
        </div>
      </main>
    </div>
  </div>

  <script>window.HBN_API_BASE = window.HBN_API_BASE || 'http://localhost:4000';</script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    (function () {
      const user = HBN.api.currentUser();
      if (!user || user.role !== 'ADMIN') { location.href = '../login.html?back=admin/payments.html'; return; }

      const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      let currentStatus = 'PENDING';

      async function load() {
        const box = document.getElementById('ordersList');
        box.innerHTML = '<div class="col-span-full text-center text-slate-400 py-12">กำลังโหลด...</div>';
        try {
          const { items } = await HBN.api.get(`/admin/orders?status=${currentStatus}&take=50`);
          if (!items.length) {
            box.innerHTML = '<div class="col-span-full card p-10 text-center text-slate-400">ไม่มีรายการ</div>';
            return;
          }
          box.innerHTML = items.map((o) => `
            <div class="card p-5">
              <div class="flex items-start justify-between mb-3">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold">${esc(o.orderNumber)}</span>
                    <span class="badge ${o.status === 'PAID' ? 'badge-green' : 'badge-orange'}">${o.status}</span>
                    <span class="badge bg-slate-100 text-slate-600">${o.paymentMethod === 'MANUAL' ? 'โอนเอง' : 'QR'}</span>
                  </div>
                  <p class="text-xs text-slate-500 mt-1">${new Date(o.createdAt).toLocaleString('th-TH')}</p>
                </div>
                <div class="text-right">
                  <div class="text-xs text-slate-500">ยอด</div>
                  <div class="text-xl font-extrabold text-brand">${HBN.ui.bahts(o.amount)}</div>
                </div>
              </div>
              <div class="text-sm text-slate-600 mb-1">${o.items.map((i) => esc(i.title)).join('<br/>')}</div>
              ${o.notes ? `<div class="text-xs bg-slate-50 rounded p-2 mt-2 text-slate-500">📝 ${esc(o.notes)}</div>` : ''}
              ${o.status !== 'PAID' ? `
                <div class="flex gap-2 mt-4">
                  <button data-approve="${o.id}" class="btn btn-primary btn-sm flex-1">
                    <i data-lucide="check" class="w-4 h-4"></i> อนุมัติ — เปิดสิทธิ์เรียน
                  </button>
                </div>` : `
                <div class="text-xs text-green-600 mt-3 flex items-center gap-1">
                  <i data-lucide="check-circle" class="w-4 h-4"></i>
                  ${o.approvedAt ? 'อนุมัติเมื่อ ' + new Date(o.approvedAt).toLocaleString('th-TH') : 'ชำระผ่าน gateway'}
                </div>`}
            </div>`).join('');
          window.lucide?.createIcons();

          box.querySelectorAll('[data-approve]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              if (!confirm('ยืนยันอนุมัติคำสั่งซื้อนี้? นักเรียนจะเข้าเรียนได้ทันที')) return;
              btn.disabled = true; btn.textContent = 'กำลังอนุมัติ...';
              try {
                await HBN.api.post(`/admin/orders/${btn.dataset.approve}/approve`, {
                  notes: 'อนุมัติผ่านหน้า admin payments',
                });
                HBN.ui.toast('อนุมัติแล้ว ✅', 'success');
                load();
              } catch (e) {
                HBN.ui.toast(e.message, 'error');
                btn.disabled = false;
              }
            });
          });
        } catch (e) {
          box.innerHTML = `<div class="col-span-full text-center text-red-500 py-12">${esc(e.message)}</div>`;
        }
      }

      document.querySelectorAll('.statusTab').forEach((t) => {
        t.addEventListener('click', () => {
          document.querySelectorAll('.statusTab').forEach((x) => x.classList.remove('active'));
          t.classList.add('active');
          currentStatus = t.dataset.status;
          load();
        });
      });

      load();
    })();
  </script>
</body>
</html>
