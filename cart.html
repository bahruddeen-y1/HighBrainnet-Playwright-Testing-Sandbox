<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ตะกร้าสินค้า — HighBrainnet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:"#2f5f88",orange:{50:"#f0f6fb",100:"#dcebf5",200:"#bdd8ec",300:"#a7cae4",400:"#85B2D5",500:"#5b97c4",600:"#4f86b5",700:"#3f7099",800:"#335a7e",900:"#274763",950:"#1c3447"}}}}};</script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-slate-50">

  <header class="sticky top-0 z-40 glass-nav">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 grid place-items-center text-white font-extrabold">H</div>
        <div class="leading-tight"><div class="font-extrabold text-[15px]">HighBrainnet</div><div class="text-[10px] text-slate-500 -mt-0.5">เรียนรู้แบบ Concept</div></div>
      </a>
      <nav class="hidden md:flex items-center gap-7 text-sm font-medium text-slate-700">
        <a href="index.html" class="hover:text-brand">หน้าแรก</a>
        <a href="courses.html" class="hover:text-brand">คอร์สเรียน</a>
        <a href="my-courses.html" class="hover:text-brand">คอร์สของฉัน</a>
      </nav>
      <div class="flex items-center gap-2">
        <a href="#" data-auth-only data-logout class="btn btn-ghost text-sm" style="display:none">ออกจากระบบ</a>
        <a href="login.html" data-guest-only class="btn btn-ghost text-sm">เข้าสู่ระบบ</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <h1 class="text-3xl font-bold mb-6 flex items-center gap-3">
      <i data-lucide="shopping-cart" class="w-7 h-7 text-brand"></i> ตะกร้าสินค้า <span id="cartCount" class="text-base font-normal text-slate-500"></span>
    </h1>

    <div class="grid lg:grid-cols-[1fr_360px] gap-8">

      <div class="grid gap-4">
        <div id="cartItems" class="grid gap-4">
          <div class="text-center text-slate-400 py-10">กำลังโหลด...</div>
        </div>
        <a href="courses.html" class="text-brand text-sm font-semibold flex items-center gap-2 mt-2"><i data-lucide="plus" class="w-4 h-4"></i> เพิ่มคอร์สอื่น</a>
      </div>

      <!-- Summary -->
      <aside class="card p-5 h-fit lg:sticky lg:top-20">
        <h3 class="font-bold mb-4">สรุปคำสั่งซื้อ</h3>
        <div class="text-sm space-y-2">
          <div class="flex justify-between"><span class="text-slate-500">ราคารวม</span><span id="sumSubtotal">—</span></div>
        </div>

        <div class="border-t border-slate-100 my-4"></div>
        <div class="flex justify-between font-bold text-lg">
          <span>ยอดสุทธิ</span><span id="sumTotal" class="text-brand">—</span>
        </div>

        <a href="checkout.html" id="checkoutBtn" class="btn btn-primary w-full mt-5">ดำเนินการชำระเงิน <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
        <div class="mt-3 text-xs text-slate-400 text-center">ชำระผ่าน QR PromptPay — ปลอดภัย 100%</div>
      </aside>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

      function render() {
        const items = HBN.cart.items();
        document.getElementById('cartCount').textContent = `(${items.length} รายการ)`;
        const box = document.getElementById('cartItems');

        if (!items.length) {
          box.innerHTML = `<div class="card p-10 text-center text-slate-400">
            ตะกร้าว่างเปล่า — <a href="courses.html" class="text-brand font-semibold">เลือกคอร์สเลย</a></div>`;
          document.getElementById('sumSubtotal').textContent = '฿0';
          document.getElementById('sumTotal').textContent = '฿0';
          document.getElementById('checkoutBtn').classList.add('pointer-events-none', 'opacity-50');
          return;
        }

        document.getElementById('checkoutBtn').classList.remove('pointer-events-none', 'opacity-50');
        box.innerHTML = items.map((it, idx) => `
          <div class="card p-4 flex gap-4">
            <div class="w-28 h-28 rounded-lg bg-orange-50 grid place-items-center text-brand font-extrabold text-2xl overflow-hidden">
              ${it.coverImageUrl ? `<img src="${esc(it.coverImageUrl)}" class="w-full h-full object-cover"/>` : 'H'}
            </div>
            <div class="flex-1">
              <div class="flex items-start justify-between">
                <div>
                  <div class="badge badge-blue mb-1">${it.itemType === 'package' ? 'แพ็คเกจ' : it.itemType === 'upgrade' ? 'อัปเกรด' : 'คอร์ส'}</div>
                  <h3 class="font-bold">${esc(it.title)}</h3>
                </div>
                <button data-remove="${idx}" class="text-slate-400 hover:text-red-500"><i data-lucide="x" class="w-5 h-5"></i></button>
              </div>
              <div class="flex items-end justify-end mt-3">
                <div class="text-xl font-bold text-brand">${HBN.ui.bahts(it.price)}</div>
              </div>
            </div>
          </div>`).join('');

        document.getElementById('sumSubtotal').textContent = HBN.ui.bahts(HBN.cart.total());
        document.getElementById('sumTotal').textContent = HBN.ui.bahts(HBN.cart.total());
        window.lucide?.createIcons();

        box.querySelectorAll('[data-remove]').forEach((btn) => {
          btn.addEventListener('click', () => {
            HBN.cart.remove(items[Number(btn.dataset.remove)]);
            render();
          });
        });
      }

      render();
    })();
  </script>
</body>
</html>
