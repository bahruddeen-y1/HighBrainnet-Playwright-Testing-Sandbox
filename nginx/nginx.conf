# HighBrainnet — nginx (serve static frontend + proxy API)
# หลังตั้ง domain แล้ว: แก้ server_name + เปิด SSL block ด้านล่าง

server {
    listen 80;
    server_name _;   # TODO: เปลี่ยนเป็น domain จริง เช่น highbrainnet.com

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ----- API proxy -----
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # ----- Static frontend -----
    root /usr/share/nginx/html;
    index index.html;

    # ไม่ serve โฟลเดอร์ภายใน
    location ~ ^/(backend|CONTEXT|nginx)/ { return 404; }
    location ~ /\. { deny all; }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

