<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ผลสอบนักเรียน — HighBrainnet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:"#2f5f88",orange:{50:"#f0f6fb",100:"#dcebf5",200:"#bdd8ec",300:"#a7cae4",400:"#85B2D5",500:"#5b97c4",600:"#4f86b5",700:"#3f7099",800:"#335a7e",900:"#274763",950:"#1c3447"}}}}};</script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-slate-50">

  <header class="sticky top-0 z-40 glass-nav">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 grid place-items-center text-white font-extrabold">H</div>
        <div class="leading-tight"><div class="font-extrabold text-[15px]">HighBrainnet</div><div class="text-[10px] text-slate-500 -mt-0.5">เรียนรู้แบบ Concept</div></div>
      </a>
      <nav class="hidden md:flex items-center gap-7 text-sm font-medium text-slate-700">
        <a href="index.html" class="hover:text-brand">หน้าแรก</a>
        <a href="courses.html" class="hover:text-brand">คอร์สเรียน</a>
        <a href="exam-results.html" class="text-brand">ผลสอบนักเรียน</a>
      </nav>
      <div class="hidden md:flex items-center gap-2">
        <a href="my-courses.html" data-auth-only class="btn btn-ghost btn-sm" style="display:none">คอร์สของฉัน</a>
        <a href="login.html" data-guest-only class="btn btn-primary btn-sm">เข้าสู่ระบบ</a>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="bg-gradient-to-br from-orange-500 to-orange-600 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-14 text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold flex items-center justify-center gap-3">
        <i data-lucide="trophy" class="w-9 h-9"></i> ผลสอบนักเรียนของเรา
      </h1>
      <p class="mt-3 text-orange-50 max-w-xl mx-auto">ความสำเร็จของนักเรียน HighBrainnet ที่สอบติดโรงเรียนเป้าหมาย</p>
      <div id="statsBar" class="mt-6 inline-flex items-center gap-2 bg-white/15 backdrop-blur rounded-full px-5 py-2 text-sm font-semibold"></div>
    </div>
  </section>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-10">

    <!-- Filters -->
    <div class="card p-4 flex flex-wrap items-center gap-3 mb-8">
      <select id="yearFilter" class="text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white">
        <option value="">ทุกปีการศึกษา</option>
      </select>
      <div class="relative flex-1 min-w-[200px]">
        <input id="schoolFilter" placeholder="ค้นหาโรงเรียน..." class="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 ring-brand"/>
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      </div>
    </div>

    <div id="resultsList" class="grid gap-8">
      <div class="text-center text-slate-400 py-12">กำลังโหลด...</div>
    </div>
  </main>

  <footer class="bg-slate-900 text-slate-400 text-center text-sm py-6">© 2026 HighBrainnet</footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const list = document.getElementById('resultsList');
      const yearSel = document.getElementById('yearFilter');
      const schoolInput = document.getElementById('schoolFilter');

      async function load() {
        list.innerHTML = '<div class="text-center text-slate-400 py-12">กำลังโหลด...</div>';
        const params = new URLSearchParams({ take: '100' });
        if (yearSel.value) params.set('year', yearSel.value);
        const school = schoolInput.value.trim();
        if (school) params.set('school', school);

        try {
          const data = await HBN.api.get('/exam-credits?' + params.toString());

          if (!data.items.length) {
            list.innerHTML = '<div class="card p-10 text-center text-slate-400">ไม่พบข้อมูล</div>';
            window.lucide?.createIcons();
            return;
          }

          // group by year
          const byYear = {};
          for (const c of data.items) (byYear[c.examYear] ||= []).push(c);
          const years = Object.keys(byYear).sort((a, b) => b - a);

          // fill year filter once
          if (yearSel.options.length === 1) {
            years.forEach((y) => {
              const o = document.createElement('option');
              o.value = y; o.textContent = `ปีการศึกษา ${y}`;
              yearSel.appendChild(o);
            });
          }

          list.innerHTML = years.map((y) => `
            <section>
              <h2 class="font-bold text-xl mb-4 flex items-center gap-2">
                <span class="w-9 h-9 rounded-lg bg-brand text-white grid place-items-center text-sm font-bold">${y}</span>
                ปีการศึกษา ${y} <span class="text-sm font-normal text-slate-500">(${byYear[y].length} คน)</span>
              </h2>
              <div class="grid sm:grid-cols-2 gap-3">
                ${byYear[y].map((c) => `
                  <div class="card p-4 flex items-center gap-4 card-hover">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 text-white grid place-items-center font-extrabold text-lg flex-shrink-0">
                      ${esc((c.displayName || 'น')[0])}
                    </div>
                    <div class="min-w-0">
                      <div class="font-bold truncate">${esc(c.displayName)}</div>
                      <div class="text-sm text-slate-600 truncate">🏫 ${esc(c.schoolName)}</div>
                      ${c.examName ? `<div class="text-xs text-slate-400 truncate">${esc(c.examName)}</div>` : ''}
                    </div>
                  </div>`).join('')}
              </div>
            </section>`).join('');
          window.lucide?.createIcons();
        } catch (e) {
          list.innerHTML = `<div class="text-center text-red-500 py-12">${esc(e.message)}</div>`;
        }
      }

      // statsBar = ยอดรวมทั้งหมดเสมอ (ไม่ผูกกับตัวกรอง) — ดึงครั้งเดียว
      async function loadStats() {
        try {
          const data = await HBN.api.get('/exam-credits?take=1');
          document.getElementById('statsBar').innerHTML =
            `<i data-lucide="sparkles" class="w-4 h-4"></i> นักเรียนสอบติดแล้ว ${data.total} คน`;
          window.lucide?.createIcons();
        } catch { /* เงียบไว้ — รายการหลักจะแสดง error เองถ้าโหลดไม่ได้ */ }
      }

      let t;
      schoolInput.addEventListener('input', () => { clearTimeout(t); t = setTimeout(load, 300); });
      yearSel.addEventListener('change', load);
      loadStats();
      load();
    })();
  </script>
</body>
</html>
